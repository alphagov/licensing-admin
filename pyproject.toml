[project]
name = "licensing-admin"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "crispy-forms-gds~=2.0.1",
    "django~=5.2.0",
    "licensing_common",
]

[dependency-groups]
dev = [
    "beautifulsoup4>=4.15.0",
    "faker>=40.44.0",
    "pre-commit>=4.6.0",
    "pymongo>=4.19.0",
    "pytest-playwright>=0.10.0",
    "ruff>=0.15.22",
    "testcontainers>=4.15.0",
    "testcontainers-mockserver>=9.2.0",
]

[tool.ruff]
line-length = 120

extend-exclude = [
    "migrations/versions/",
    "__pycache__",
    "cache",
    "migrations",
]

[tool.ruff.lint]
extend-select = [
    "DJ",
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "C90",
    "G",
    "T20",
    "C4",
    "ISC",
    "RSE",
    "PIE",
    "N804",
    "RUF100",
]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"


[tool.uv.sources]
licensing_common = {path="./licensing_common", package= false}