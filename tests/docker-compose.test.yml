services:
  django:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: test.env
    environment:
      PYTHONUNBUFFERED: "1"
    depends_on:
      - mockserver
      - document_db

  mockserver:
    image: mockserver/mockserver:latest
    environment:
      MOCKSERVER_ENABLE_VELOCITY: "true"
      MOCKSERVER_LOG_LEVEL: DEBUG
    ports:
      - "1080:1080" # The hostname pin is important!

  document_db:
    image: ghcr.io/documentdb/documentdb/documentdb-local:latest
    # Must match DOCUMENTDB_USER and  DOCUMENTDB_PASSWORD in test.env
    environment:
      - USERNAME=docdb
      - PASSWORD=password
    ports:
      - "10260"
