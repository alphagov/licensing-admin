services:
  django:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8000"
    environment:
      DOCUMENTDB_HOST: document_db
      DOCUMENTDB_PORT: "10260"
      DOCUMENTDB_USER: docdb
      DOCUMENTDB_PASSWORD: password
      DOCUMENTDB_ALLOW_INVALID_CERTS: "true"
      DJANGO_ALLOWED_HOSTS: "*"
      IS_PRODUCTION: "false"
      OAUTH_CALLBACK_URL_OVERRIDE: ""
      PYTHONUNBUFFERED: "1"
      SIGNON_URL: http://mockserver:1080
      SIGNON_CLIENT_ID: test-client-id
      SIGNON_CLIENT_SECRET: test-client-secret
      DJANGO_SECRET_KEY: ttr495tyh65t^Y^%$R%Edw
    depends_on:
      - mockserver
      - document_db

  mockserver:
    image: mockserver/mockserver:latest
    environment:
      MOCKSERVER_ENABLE_VELOCITY: "true"
      MOCKSERVER_LOG_LEVEL: INFO
    ports:
      - "1080"

  document_db:
    image: ghcr.io/documentdb/documentdb/documentdb-local:latest
    environment:
      - USERNAME=docdb
      - PASSWORD=password
    ports:
      - "10260"