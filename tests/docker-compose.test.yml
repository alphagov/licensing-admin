services:
  django:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DOCUMENTDB_HOST: document_db
      DOCUMENTDB_PORT: "10260"
      DOCUMENTDB_USER: docdb
      DOCUMENTDB_PASSWORD: password
      DOCUMENTDB_ALLOW_INVALID_CERTS: "true"
      DJANGO_ALLOWED_HOSTS: "*"
      IS_PRODUCTION: "false"
      PYTHONUNBUFFERED: "1"
      SIGNON_AUTH_CODE_REQUEST_URL: http://localhost:1080/oauth/authorize
      ADMIN_APP_AUTH_CODE_RESPONSE_URL: http://localhost:8000/oauth
      SIGNON_ACCESS_TOKEN_REQUEST_URL: http://mockserver:1080/oauth/token
      SIGNON_USER_DETAILS_URL: http://mockserver:1080/user.json
      SIGNON_CLIENT_ID: test-client-id
      SIGNON_CLIENT_SECRET: test-client-secret
      SIGNON_LOGOUT_URL: http://localhost:1080/users/sign_out
      DJANGO_SECRET_KEY: thisisverysecret
    depends_on:
      - mockserver
      - document_db

  mockserver:
    image: mockserver/mockserver:latest
    environment:
      MOCKSERVER_ENABLE_VELOCITY: "true"
      MOCKSERVER_LOG_LEVEL: DEBUG
    ports:
      - "1080:1080" # The hostname pin is important!

  document_db:
    image: ghcr.io/documentdb/documentdb/documentdb-local:latest
    environment:
      - USERNAME=docdb
      - PASSWORD=password
    ports:
      - "10260"