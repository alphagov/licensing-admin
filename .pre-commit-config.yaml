repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: mise exec -- uv run ruff check --fix
        language: system
        types_or: [ python, pyi ]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: mise exec -- uv run ruff format
        language: system
        types_or: [ python, pyi ]
        require_serial: true